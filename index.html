<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pendaftaran Daurah Pembina GSD</title>
<style>
  :root { --hijau:#0f766e; --hijau-tua:#115e59; --bg:#f0fdfa; --teks:#0f172a; --abu:#64748b; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: 'Segoe UI', Roboto, Arial, sans-serif; background: var(--bg); color: var(--teks); }
  .wrap { max-width: 520px; margin: 0 auto; padding: 20px 16px 40px; }
  .header { background: linear-gradient(135deg, var(--hijau), var(--hijau-tua)); color:#fff; border-radius:16px 16px 0 0; padding:28px 22px; text-align:center; }
  .logo-box { display:none; width:120px; height:120px; margin:0 auto 14px; background:#fff; border-radius:50%; padding:10px; box-shadow:0 4px 14px rgba(0,0,0,.2); align-items:center; justify-content:center; }
  .logo-box.show { display:flex; }
  .logo-box img { max-width:100%; max-height:100%; object-fit:contain; }
  .header .kecil { font-size:13px; letter-spacing:1.5px; opacity:.85; text-transform:uppercase; }
  .header h1 { margin:8px 0 4px; font-size:22px; line-height:1.3; }
  .header p { margin:0; font-size:14px; opacity:.9; }
  .card { background:#fff; border-radius:0 0 16px 16px; padding:24px 22px; box-shadow:0 6px 20px rgba(15,118,110,.12); }
  label { display:block; font-weight:600; font-size:14px; margin-bottom:6px; }
  label span { color:#dc2626; }
  input, select { width:100%; padding:12px 14px; font-size:16px; border:1.5px solid #cbd5e1; border-radius:10px; background:#fff; color:var(--teks); }
  input:focus, select:focus { outline:none; border-color:var(--hijau); box-shadow:0 0 0 3px rgba(15,118,110,.15); }
  .field { margin-bottom:18px; }
  .hint { font-size:12px; color:var(--abu); margin-top:5px; }
  button { width:100%; padding:14px; font-size:16px; font-weight:700; color:#fff; background:var(--hijau); border:none; border-radius:10px; cursor:pointer; }
  button:hover { background:var(--hijau-tua); }
  button:disabled { opacity:.6; cursor:not-allowed; }
  .pesan { display:none; margin-top:16px; padding:12px 14px; border-radius:10px; font-size:14px; }
  .pesan.err { display:block; background:#fee2e2; color:#991b1b; }
  .footer { text-align:center; font-size:12px; color:var(--abu); margin-top:18px; }
  .overlay { display:none; position:fixed; inset:0; background:rgba(15,23,42,.55); align-items:center; justify-content:center; padding:20px; z-index:99; }
  .overlay.show { display:flex; }
  .modal { background:#fff; border-radius:18px; max-width:360px; width:100%; padding:30px 24px 24px; text-align:center; box-shadow:0 20px 50px rgba(0,0,0,.25); animation:muncul .25s ease; }
  .modal .ikon { width:68px; height:68px; margin:0 auto 14px; border-radius:50%; background:#dcfce7; color:#16a34a; font-size:38px; line-height:68px; font-weight:700; }
  .modal h2 { margin:0 0 8px; font-size:22px; color:var(--hijau-tua); }
  .modal p { margin:0 0 20px; font-size:15px; line-height:1.5; color:#334155; }
  @keyframes muncul { from { transform:scale(.9); opacity:0; } to { transform:scale(1); opacity:1; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="logo-box" id="logoBox"><img id="logo" src="logo.png" alt="Logo Wahdah Islamiyah"></div>
    <div class="kecil">Form Pendaftaran</div>
    <h1>Daurah Pembina<br>Gerakan Sejuta Dai (GSD)</h1>
    <p>Silakan lengkapi data berikut</p>
  </div>

  <div class="card">
    <form id="form" autocomplete="off">
      <div class="field">
        <label for="nama">Nama <span>*</span></label>
        <input type="text" id="nama" placeholder="Nama lengkap" required>
      </div>

      <div class="field">
        <label for="dpc">Asal DPC <span>*</span></label>
        <select id="dpc" required>
          <option value="">-- Pilih Kecamatan --</option>
          <option>Bajeng</option>
          <option>Bajeng Barat</option>
          <option>Barombong</option>
          <option>Biringbulu</option>
          <option>Bontolempangan</option>
          <option>Bontomarannu</option>
          <option>Bontonompo</option>
          <option>Bontonompo Selatan</option>
          <option>Bungaya</option>
          <option>Manuju</option>
          <option>Pallangga</option>
          <option>Parangloe</option>
          <option>Parigi</option>
          <option>Pattallassang</option>
          <option>Somba Opu</option>
          <option>Tinggimoncong</option>
          <option>Tombolo Pao</option>
          <option>Tompobulu</option>
        </select>
      </div>

      <div class="field">
        <label for="wa">No WhatsApp <span>*</span></label>
        <input type="tel" id="wa" inputmode="numeric" placeholder="Contoh: 081234567890" required>
        <div class="hint">Gunakan nomor WhatsApp yang aktif.</div>
      </div>

      <button type="submit" id="btn">Daftar Sekarang</button>
      <div id="pesan" class="pesan"></div>
    </form>
  </div>

  <div class="footer">Dibuat oleh Ai Mastermind</div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <div class="ikon">&#10003;</div>
    <h2>Syukron Jazakallah</h2>
    <p>Anda sudah berhasil terdaftar.</p>
    <button type="button" id="tutup">Tutup</button>
  </div>
</div>

<script>
  // GANTI dengan URL aplikasi web Apps Script Anda (berakhiran /exec)
  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyjz4VbPLQAm9gH1CcETjWDhdiKRDgHAku_u4UqVUV2HYVpPTRh_gIhSlvQYl2Q53bP/exec';

  const form = document.getElementById('form');
  const btn = document.getElementById('btn');
  const pesan = document.getElementById('pesan');

  // Tampilkan logo hanya jika file logo.png ada
  const logo = document.getElementById('logo');
  logo.onload = function () { document.getElementById('logoBox').classList.add('show'); };
  if (logo.complete && logo.naturalWidth > 0) logo.onload();

  function tampilError(teks) {
    pesan.className = 'pesan err';
    pesan.textContent = teks;
  }

  document.getElementById('tutup').addEventListener('click', function () {
    document.getElementById('overlay').classList.remove('show');
  });

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    pesan.className = 'pesan';

    if (APPS_SCRIPT_URL.indexOf('GANTI_DENGAN') !== -1) {
      tampilError('URL Apps Script belum diisi.');
      return;
    }

    const data = {
      nama: document.getElementById('nama').value,
      dpc: document.getElementById('dpc').value,
      wa: document.getElementById('wa').value
    };

    btn.disabled = true;
    btn.textContent = 'Mengirim...';

    try {
      // Content-Type default (text/plain) dipakai agar tidak memicu preflight CORS
      const resp = await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify(data)
      });
      const res = await resp.json();
      if (res.ok) {
        form.reset();
        document.getElementById('overlay').classList.add('show');
      } else {
        tampilError(res.pesan || 'Pendaftaran gagal.');
      }
    } catch (err) {
      tampilError('Gagal mengirim data. Periksa koneksi dan coba lagi.');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Daftar Sekarang';
    }
  });
</script>
</body>
</html>
